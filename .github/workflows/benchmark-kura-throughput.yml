# Measures bulk upload/download throughput against Kura cache nodes
# from inside a Tuist runner, using the same module multipart flow the
# CLI uses for binary artifacts.
#
# Designed for path A/B comparisons (e.g. public ingress vs in-cluster
# Service URL of the same node). Leave `public_url` empty to measure a
# single endpoint. The `TUIST_BENCH_TOKEN` repository secret must hold
# a token whose grants cover `<tenant_id>/<namespace_id>` on the
# targeted environment.
name: Kura throughput benchmark
on:
  # Push trigger lets the benchmark run from this branch without
  # waiting for a merge to main (dispatch only sees workflows on the
  # default branch). Scoped to the benchmark branch so ordinary repo
  # pushes don't fire 200MB transfer jobs.
  push:
    branches: [kura-throughput-benchmark]
  workflow_dispatch:
    inputs:
      private_url:
        description: In-cluster Kura base URL
        default: "http://kura-marek-staging.kura.svc.cluster.local:4000"
      public_url:
        description: Public Kura base URL for the same tenant (empty = skip)
        default: ""
      tenant_id:
        description: Account handle the token is granted for
        default: "marek"
      namespace_id:
        description: Project handle under the tenant
        default: "tuist"
      size_mb:
        description: Artifact size in MB
        default: "200"
      iterations:
        description: Upload/download cycles per endpoint
        default: "3"
      runner:
        description: runs-on label (staging fleet = shape-linux-2vcpu-8gb)
        default: "shape-linux-2vcpu-8gb"

jobs:
  bench:
    runs-on: ${{ inputs.runner || 'shape-linux-2vcpu-8gb' }}
    timeout-minutes: 30
    env:
      TOKEN: ${{ secrets.TUIST_BENCH_TOKEN }}
      TENANT: ${{ inputs.tenant_id || 'marek' }}
      NAMESPACE: ${{ inputs.namespace_id || 'tuist' }}
      SIZE_MB: ${{ inputs.size_mb || '200' }}
      ITERATIONS: ${{ inputs.iterations || '3' }}
      PRIVATE_URL: ${{ inputs.private_url || 'http://kura-marek-staging.kura.svc.cluster.local:4000' }}
      PUBLIC_URL: ${{ inputs.public_url || '' }}
    steps:
      - name: Generate artifact
        run: |
          head -c "$((SIZE_MB * 1024 * 1024))" /dev/urandom > /tmp/blob.bin
          ls -l /tmp/blob.bin
      - name: Benchmark
        run: |
          set -u
          AUTH="Authorization: Bearer $TOKEN"
          NSQ="tenant_id=$TENANT&namespace_id=$NAMESPACE"

          bench_endpoint() { # $1=label $2=base_url
            local label="$1" base="$2"
            echo "::group::$label ($base)"
            for i in $(seq 1 "$ITERATIONS"); do
              local hash="bench-${GITHUB_RUN_ID}-${label}-${i}"
              local name="blob"
              local modq="$NSQ&cache_category=builds&hash=$hash&name=$name"

              local upload_id
              upload_id=$(curl -sf -X POST -H "$AUTH" \
                "$base/api/cache/module/start?$modq" | jq -r '.upload_id')
              if [ -z "$upload_id" ] || [ "$upload_id" = "null" ]; then
                echo "$label#$i START FAILED"; continue
              fi

              # Parts are capped at 10MB (MAX_MODULE_PART_BYTES) and the
              # part response is a bare 204 — complete takes the part
              # numbers, not etags (CompleteMultipartRequest.parts: Vec<u32>).
              local nparts=$(( (SIZE_MB + 9) / 10 ))
              local p=1 t_up=0 parts="" out code t fail=0
              while [ "$p" -le "$nparts" ]; do
                dd if=/tmp/blob.bin of=/tmp/part.bin bs=1M skip=$(( (p-1)*10 )) count=10 2>/dev/null
                out=$(curl -s -o /dev/null -X POST -H "$AUTH" --data-binary @/tmp/part.bin \
                  -w '%{http_code} %{time_total}' \
                  "$base/api/cache/module/part?$modq&upload_id=$upload_id&part_number=$p") || { fail=1; break; }
                code=${out%% *}; t=${out##* }
                { [ "$code" != "204" ] && [ "$code" != "200" ]; } && { fail=$code; break; }
                t_up=$(awk "BEGIN{print $t_up+$t}")
                parts="$parts$p,"
                p=$((p+1))
              done
              if [ "$fail" != "0" ]; then echo "$label#$i PART FAILED ($fail) at part $p"; continue; fi

              curl -sf -X POST -H "$AUTH" -H 'Content-Type: application/json' \
                -d "{\"parts\":[${parts%,}]}" \
                "$base/api/cache/module/complete?$NSQ&upload_id=$upload_id" > /dev/null \
                || { echo "$label#$i COMPLETE FAILED"; continue; }

              local down
              down=$(curl -sf -H "$AUTH" -o /dev/null \
                -w '%{speed_download} %{time_total} %{http_code}' \
                "$base/api/cache/module/$name?$modq")
              echo "$label iter=$i upload_MBps=$(awk "BEGIN{printf \"%.1f\", $SIZE_MB/$t_up}") download_MBps=$(awk "BEGIN{printf \"%.1f\", $(echo "$down" | cut -d' ' -f1)/1048576}") download_s=$(echo "$down" | cut -d' ' -f2) http=$(echo "$down" | cut -d' ' -f3)" | tee -a /tmp/results.txt
            done
            echo "::endgroup::"
          }

          bench_endpoint private "$PRIVATE_URL"
          if [ -n "$PUBLIC_URL" ]; then
            bench_endpoint public "$PUBLIC_URL"
          fi
      - name: Summary
        run: |
          {
            echo "## Kura throughput — ${SIZE_MB}MB × ${ITERATIONS} iterations"
            echo '```'
            cat /tmp/results.txt 2>/dev/null || echo "no results"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
